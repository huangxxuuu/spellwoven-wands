<div id="spell-card-structure" aria-label="法术卡轮廓与触发变体结构示意">
  <div class="viz-controls">
    <label class="form-label" for="spell-card-size">图标尺寸 <output id="spell-card-size-value" class="tabular-nums">64 px</output><input id="spell-card-size" class="form-range" type="range" min="32" max="64" step="16" value="64"></label>
    <label class="form-check form-switch"><input id="spell-card-gray" class="form-check-input" type="checkbox"><span class="form-check-label">灰度检查</span></label>
  </div>
  <div class="viz-dotted-background">
    <div class="sc-product" aria-label="法术卡结构样稿">
      <div class="sc-section-title">物品栏 · 六种功能轮廓</div>
      <div class="sc-types">
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-projectile" role="img" aria-label="投射物：尖顶卡，火球图案"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span></div></div><span>投射物</span></div>
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-modifier" role="img" aria-label="修饰：菱形卡，转弯箭头"><span class="sc-frame"></span><span class="sc-art sc-teal"><i data-lucide="corner-up-right" aria-hidden="true"></i></span></div></div><span>修饰</span></div>
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-multicast" role="img" aria-label="多重：双齿卡，多张法术卡一同施放"><span class="sc-frame"></span><span class="sc-art sc-purple"><i data-lucide="copy" aria-hidden="true"></i></span></div></div><span>多重</span></div>
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-melee" role="img" aria-label="近战：下尖卡，剑图案"><span class="sc-frame"></span><span class="sc-art sc-steel"><i data-lucide="sword" aria-hidden="true"></i></span></div></div><span>近战</span></div>
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-field" role="img" aria-label="场和静态投射物：有底座的方卡，晶体图案"><span class="sc-frame"></span><span class="sc-art sc-purple"><i data-lucide="gem" aria-hidden="true"></i></span></div></div><span>场／静态</span></div>
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-instant" role="img" aria-label="瞬发：圆肩卡，闪电图案"><span class="sc-frame"></span><span class="sc-art sc-lightning"><i data-lucide="zap" aria-hidden="true"></i></span></div></div><span>瞬发</span></div>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-section-title">同一弹体 · 同一主图 · 左上触发角标</div>
      <div class="sc-variants">
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-projectile" role="img" aria-label="普通火球，无角标"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span></div></div><span>火球</span></div>
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-projectile" role="img" aria-label="碰撞火球，左上撞击标记，右下堆叠数量示意12"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span><span class="sc-badge"><i data-lucide="asterisk" aria-hidden="true"></i></span><span class="sc-count">12</span></div></div><span>火球 · 碰撞</span></div>
        <div class="sc-sample"><div class="sc-slot"><div class="sc-token sc-projectile" role="img" aria-label="定时火球，左上沙漏标记"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span><span class="sc-badge"><i data-lucide="hourglass" aria-hidden="true"></i></span></div></div><span>火球 · 定时</span></div>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-section-title">地面 · 单卡与混合卡堆</div>
      <div class="sc-ground-grid">
        <div class="sc-sample"><div class="sc-ground"><div class="sc-ground-shadow"></div><div class="sc-ground-top sc-token sc-projectile"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span></div></div><span>单卡</span></div>
        <div class="sc-sample"><div class="sc-ground sc-pile-small"><div class="sc-ground-shadow"></div><div class="sc-under sc-token sc-field"><span class="sc-frame"></span></div><div class="sc-ground-top sc-token sc-projectile"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span></div></div><span>2–3 张</span></div>
        <div class="sc-sample"><div class="sc-ground sc-pile-medium"><div class="sc-ground-shadow"></div><div class="sc-paper-edge"></div><div class="sc-under sc-token sc-field"><span class="sc-frame"></span></div><div class="sc-under-two sc-token sc-modifier"><span class="sc-frame"></span></div><div class="sc-ground-top sc-token sc-projectile"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span></div></div><span>4–6 张</span></div>
        <div class="sc-sample"><div class="sc-ground sc-pile-large"><div class="sc-ground-shadow"></div><div class="sc-paper-edge"></div><div class="sc-under sc-token sc-field"><span class="sc-frame"></span></div><div class="sc-under-two sc-token sc-modifier"><span class="sc-frame"></span></div><div class="sc-ground-top sc-token sc-projectile"><span class="sc-frame"></span><span class="sc-art sc-fire"><i data-lucide="flame" aria-hidden="true"></i></span></div></div><span>7–25 张</span></div>
      </div>
    </div>
  </div>
  <span id="spell-card-status" class="sr-only" aria-live="polite">当前尺寸64像素，彩色</span>
</div>
<style>
#spell-card-structure { display:grid; gap:14px; }
#spell-card-structure .sc-product { --sc-size:64px; --sc-ink:#45362b; --sc-paper:#e7d7b8; --sc-paper-low:#d4bf9a; font-family:"Microsoft YaHei",sans-serif; font-size:13px; line-height:1.5; color:#eee3cb; padding:20px 18px; background:#332e27; border-radius:8px; }
#spell-card-structure .sc-section-title { font-size:12px; letter-spacing:.04em; color:#d0bea0; margin-bottom:12px; }
#spell-card-structure .sc-types { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; }
#spell-card-structure .sc-sample { display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0; text-align:center; }
#spell-card-structure .sc-slot { display:grid; width:78px; height:78px; place-items:center; border-radius:5px; background:radial-gradient(ellipse at 50% 38%,#5f5546 0%,#433b31 65%,#3b332b 100%); box-shadow:inset 0 0 0 1px #76654c; }
#spell-card-structure .sc-token { position:relative; display:block; flex:none; width:var(--sc-size); height:var(--sc-size); filter:drop-shadow(0 1px 1px #17120d); }
#spell-card-structure .sc-frame { position:absolute; inset:0; background:var(--sc-ink); clip-path:var(--sc-shape); }
#spell-card-structure .sc-frame::after { content:""; position:absolute; inset:calc(var(--sc-size) * .041); background:linear-gradient(145deg,var(--sc-paper),var(--sc-paper-low)); clip-path:var(--sc-shape); }
#spell-card-structure .sc-projectile { --sc-shape:polygon(50% 0%,90% 16%,90% 92%,10% 92%,10% 16%); }
#spell-card-structure .sc-modifier { --sc-shape:polygon(50% 0%,100% 50%,50% 100%,0% 50%); }
#spell-card-structure .sc-multicast { --sc-shape:polygon(9% 0%,41% 0%,41% 14%,59% 14%,59% 0%,91% 0%,91% 92%,9% 92%); }
#spell-card-structure .sc-melee { --sc-shape:polygon(10% 3%,90% 3%,90% 70%,50% 100%,10% 70%); }
#spell-card-structure .sc-field { --sc-shape:polygon(20% 5%,80% 5%,88% 14%,88% 75%,100% 75%,100% 94%,0% 94%,0% 75%,12% 75%,12% 14%); }
#spell-card-structure .sc-instant { --sc-shape:polygon(27% 2%,73% 2%,98% 27%,98% 73%,73% 98%,27% 98%,2% 73%,2% 27%); }
#spell-card-structure .sc-art { position:absolute; inset:20%; display:flex; align-items:center; justify-content:center; color:#734d2c; }
#spell-card-structure .sc-art svg { width:calc(var(--sc-size) * .60) !important; height:calc(var(--sc-size) * .60) !important; stroke-width:2.4; }
#spell-card-structure .sc-fire { color:#a64624; }
#spell-card-structure .sc-fire svg { fill:#cf632d; stroke:#703a25; stroke-width:1.8; }
#spell-card-structure .sc-teal { color:#326c68; }
#spell-card-structure .sc-purple { color:#755078; }
#spell-card-structure .sc-steel { color:#475f62; }
#spell-card-structure .sc-lightning svg { fill:#d8a43c; stroke:#735324; stroke-width:1.8; }
#spell-card-structure .sc-divider { height:1px; background:#655642; margin:19px 0 17px; }
#spell-card-structure .sc-variants { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); max-width:420px; margin:0 auto; gap:12px; }
#spell-card-structure .sc-badge { position:absolute; left:0; top:0; display:grid; place-items:center; width:31%; height:31%; background:#e8dac0; color:#4b3829; border:1.4px solid #4b3829; border-radius:3px; }
#spell-card-structure .sc-badge svg { width:calc(var(--sc-size) * .24) !important; height:calc(var(--sc-size) * .24) !important; stroke-width:2.6; }
#spell-card-structure .sc-count { position:absolute; right:-3px; bottom:-6px; font-size:13px; font-weight:500; color:#fff0cf; text-shadow:1px 1px #211a13,-1px -1px #211a13,1px -1px #211a13,-1px 1px #211a13; }
#spell-card-structure .sc-ground-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; background:#585b47; padding:10px 4px 12px; border-radius:5px; }
#spell-card-structure .sc-ground { position:relative; width:96px; height:80px; }
#spell-card-structure .sc-ground .sc-token { position:absolute; left:50%; top:50%; margin-left:calc(var(--sc-size) * -.5); margin-top:calc(var(--sc-size) * -.5); }
#spell-card-structure .sc-ground-shadow { position:absolute; left:12%; top:43%; width:77%; height:33%; background:#2f3226; border-radius:50%; filter:blur(3px); opacity:.65; }
#spell-card-structure .sc-ground-top { z-index:3; transform:translateY(-3px) rotate(-10deg) skewX(-7deg) scaleY(.72); }
#spell-card-structure .sc-under { z-index:1; transform:translate(3px,3px) rotate(7deg) skewX(-7deg) scaleY(.72); }
#spell-card-structure .sc-under-two { z-index:2; transform:translate(-3px,-1px) rotate(5deg) skewX(-7deg) scaleY(.72); }
#spell-card-structure .sc-under .sc-frame::after,#spell-card-structure .sc-under-two .sc-frame::after { background:#cbbb9c; }
#spell-card-structure .sc-pile-medium .sc-ground-top { transform:translateY(-7px) rotate(-10deg) skewX(-7deg) scaleY(.72); }
#spell-card-structure .sc-pile-large .sc-ground-top { transform:translateY(-13px) rotate(-10deg) skewX(-7deg) scaleY(.72); }
#spell-card-structure .sc-pile-large .sc-under-two { transform:translate(-3px,-7px) rotate(5deg) skewX(-7deg) scaleY(.72); }
#spell-card-structure .sc-pile-large .sc-under { transform:translate(3px,-3px) rotate(7deg) skewX(-7deg) scaleY(.72); }
#spell-card-structure .sc-paper-edge { position:absolute; z-index:0; width:calc(var(--sc-size) * .83); height:10px; left:50%; top:56%; transform:translateX(-50%) rotate(-2deg); background:repeating-linear-gradient(0deg,#ac9d80 0px,#ac9d80 1px,#d9c9a9 1px,#d9c9a9 3px); border:1px solid #5a503e; }
#spell-card-structure .sc-pile-large .sc-paper-edge { height:17px; top:49%; }
#spell-card-structure .sc-product[data-gray="true"] .sc-slot,#spell-card-structure .sc-product[data-gray="true"] .sc-ground-grid { filter:grayscale(1); }
@media(max-width:600px) { #spell-card-structure .sc-types { grid-template-columns:repeat(3,minmax(0,1fr)); row-gap:18px; } }
@media(max-width:430px) { #spell-card-structure .sc-product { padding:16px 12px; } #spell-card-structure .sc-ground-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } #spell-card-structure .sc-types,#spell-card-structure .sc-variants { gap:14px 6px; } }
</style>
<script>
(() => {
  const root = document.getElementById('spell-card-structure');
  const product = root.querySelector('.sc-product');
  const sizeInput = root.querySelector('#spell-card-size');
  const grayInput = root.querySelector('#spell-card-gray');
  const sizeOutput = root.querySelector('#spell-card-size-value');
  const status = root.querySelector('#spell-card-status');
  function render(saved) {
    if (saved && typeof saved === 'object') {
      if ([32,48,64].includes(Number(saved.size))) sizeInput.value = String(saved.size);
      if (typeof saved.gray === 'boolean') grayInput.checked = saved.gray;
    }
    const size = Number(sizeInput.value);
    product.style.setProperty('--sc-size', size + 'px');
    product.dataset.gray = String(grayInput.checked);
    sizeOutput.textContent = size + ' px';
    status.textContent = '当前尺寸' + size + '像素，' + (grayInput.checked ? '灰度' : '彩色');
  }
  function update() {
    render();
    const state = { size:Number(sizeInput.value), gray:grayInput.checked };
    if (window.openai && typeof window.openai.setWidgetState === 'function') {
      const pending = window.openai.setWidgetState({ modelContent:{ cardPreview:state }, privateContent:state });
      if (pending && typeof pending.catch === 'function') pending.catch(() => {});
    }
  }
  sizeInput.addEventListener('input', update);
  grayInput.addEventListener('change', update);
  render(window.openai && window.openai.widgetState && window.openai.widgetState.privateContent);
  window.addEventListener('openai:set_globals', event => {
    const saved = event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (saved) render(saved.privateContent);
  });
})();
</script>
