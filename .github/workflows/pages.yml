name: Validate and publish field guide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_public:
        description: 'Deploy the public field guide (public repository only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Install build dependencies
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Test Lua rules and restricted modinfo loader
        run: python tools/run_tests.py
      - name: Test release safety and retry behavior
        run: python tools/run_python_tests.py -p 'test_release*.py'
      - name: Build Chinese and English field guide
        run: python site/build_catalog.py --pages
      - name: Check translations and site links
        run: |
          python tools/quiet_check.py tools/check_localization.py
          python tools/quiet_check.py tools/check_site_links.py --directory site/public
      - name: Upload field guide
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_public && !github.event.repository.private
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/public

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_public && !github.event.repository.private && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish field guide
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
